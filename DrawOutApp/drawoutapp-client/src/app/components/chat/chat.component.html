<div class="chat-container">
    <!-- Display chat messages -->
    <ul class="list-group chat-messages">
        <li *ngFor="let message of messages" class="list-group-item message-item">
            <div class="message-header">
                <strong class="message-sender">{{ message.sender }}:</strong>
                <small class="message-timestamp">{{ formatTimestamp(message.timestamp) }}</small>
            </div>
            <div class="message-text">{{ message.content }}</div>
        </li>
    </ul>

    <!-- Chat input and send button -->
    <div class="input-group chat-input-container">
        <input type="text" [(ngModel)]="chatInput" (keydown)="handleKeyDown($event)" (input)="updateCharacterCount()" placeholder="Type your message..."
            class="form-control" />
        <!-- <span class="char-count">{{ charCount }}</span> -->
    </div>
</div>
