<div class="room-container">
  <!-- Header -->
  <div class="room-header">
    <div class="room-name">
      <h2>{{ room?.roomName }}</h2>
    </div>

    <div *ngIf="!gameStarted" class="room-status">
      <p>Waiting for players...</p>
    </div>

    <div *ngIf="!gameStarted" class="room-round">
      <p>Round {{ currentRound }} of {{ 8 }}</p>
    </div>
  </div>

  <!-- Teams and Canvas -->
  <div class="room-main">
    <div class="team-canvas-container">

      <app-user-list class="user-team-list" [users]="users" [team]="redTeam" [currentTeam]="currentTeam" className="Red"
        (teamChange)="handleTeamJoin($event)"></app-user-list>

      <div class="whiteboard-container">
        <app-whiteboard></app-whiteboard>
      </div>

      <app-user-list class="user-team-list" [users]="users" [team]="blueTeam" [currentTeam]="currentTeam"
        className="Blue" (teamChange)="handleTeamJoin($event)"></app-user-list>

    </div>

    <div class="below-canvas-container">
      <!-- Invite Section -->
      <!-- Pomeriti inv ispod canvasa i dodati spectator mode za usere koji nisu jos usli u tim-->
      <div class="invite-container">
        <p>Invite your friends!</p>

        <button (click)="copyInviteLink()">Copy Invite Link</button>
      </div>

      <!-- Chat -->
      <div class="chat-container">
        <app-chat name="fieldName" ngDefaultControl [messages]="chatMessages" [(ngModel)]="chatInput"
          (messageSent)="sendMessage($event)">
        </app-chat>
      </div>
    </div>
  </div>
  <div class="room-footer">
    <app-user-list class="user-team-list" [users]="users" [team]=" this.redTeam.concat(this.blueTeam)"
      [currentTeam]="currentTeam" className="Spectators" (teamChange)="handleTeamJoin($event)"></app-user-list>
  </div>
</div>
